<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#g)"/>

  <!-- Top shine -->
  <rect x="2" y="2" width="60" height="32" rx="16" fill="url(#shine)"/>

  <!-- Fork (left) -->
  <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M20 14v8a3 3 0 0 0 3 3v0a3 3 0 0 0 3-3v-8"/>
    <line x1="23" y1="25" x2="23" y2="50"/>
  </g>

  <!-- Spoon (right) -->
  <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <ellipse cx="44" cy="20" rx="4" ry="6"/>
    <line x1="44" y1="26" x2="44" y2="50"/>
  </g>

  <!-- Center dot accent -->
  <circle cx="32" cy="38" r="2" fill="rgba(255,255,255,.7)"/>
</svg>